<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">

        <header class="heading">
            <h1>My Store</h1>
        </header>

        <div class="filters">

            <input type="search" id="search-bar" placeholder="Search for Products">

            <select id="category-select">
                <option value="all">All Categories</option>
                <option value="men's clothing">men's clothing</option>
                <option value="jewelery">jewelery</option>
                <option value="electronics">electronics</option>
                <option value="women's clothing">women's clothing</option>
            </select>

            <input type="number" id="min-price" min="0" placeholder="Min Price">

            <input type="number" id="max-price" min="0" placeholder="Max Price">

            <button id="apply-filters">Apply Filters</button>

        </div>

        <select id="sort-select">
            <option value="sort-by-name">Sort by Name</option>
            <option value="sort-by-price">Sort by Price</option>
            <option value="sort-by-rating">Sort by Rating</option>
        </select>

        <div class="shopping-cart">

            <h2>Shopping Cart</h2>

            <ul id="cart-items">
                <li class="empty-cart">Your cart is empty</li>
            </ul>

            <div class="cart-summary">
                <p>
                    Total quantity:
                    <span id="cart-quantity">0</span>
                </p>

                <p>
                    Total Price: $
                    <span id="cart-total">0.00</span>
                </p>
            </div>

        </div>

    </div>

    <dialog id="product-details" aria-labelledby="product-detail-title"></dialog>

    <div class="productList"></div>

    <div id="pagination"></div>

    <script src="script.js"></script>

</body>

</html>
